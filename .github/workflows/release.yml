name: Release

# Builds the MCP server and every Revit/AutoCAD add-in (2022-2027), runs the tests, and publishes a
# GitHub release with the per-version zips.
#
#   Tag push:  git tag v0.1.0 && git push origin v0.1.0
#              A tag with a suffix (v0.2.0-beta.1) becomes a pre-release.
#   Manual:    Actions → Release → Run workflow (choose the tag; optionally pre-release / draft).
#
# The tag's version must match <Version> in Directory.Build.props (the suffix after '-' is ignored),
# so zip names and assembly versions always agree with the release.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release, e.g. v0.1.0 (created on the selected branch if it does not exist)'
        required: true
      prerelease:
        description: 'Mark as pre-release'
        type: boolean
        default: true
      draft:
        description: 'Create as draft (publish manually after review)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # All event data goes through env vars (never inlined into scripts); TAG is validated before use.
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      EVENT_NAME: ${{ github.event_name }}
      INPUT_PRERELEASE: ${{ github.event.inputs.prerelease }}
      INPUT_DRAFT: ${{ github.event.inputs.draft }}
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          # 10.0 builds everything (incl. the 2027 add-ins and the server); 8.0 supplies the
          # reference packs for the 2025/2026 add-ins without relying on a NuGet download.
          # The net48 add-ins (2022-2024) use the .NET Framework reference assemblies package.
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Check tag matches project version
        id: version
        run: |
          version="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props | head -1)"
          tag_version="${TAG#v}"
          base="${tag_version%%-*}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$TAG' is not of the form vX.Y.Z or vX.Y.Z-suffix"; exit 1
          fi
          if [[ "$base" != "$version" ]]; then
            echo "::error::Tag $TAG does not match <Version>$version</Version> in Directory.Build.props"; exit 1
          fi
          prerelease=false
          [[ "$tag_version" == *-* ]] && prerelease=true
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            [[ "$INPUT_PRERELEASE" == "true" ]] && prerelease=true || prerelease=false
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "Releasing $TAG (version $version, prerelease=$prerelease)"

      - name: Test, build all versions, package
        run: scripts/build.sh

      - name: Checksums and release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd dist
          sha256sum *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt
          sed -e "s/{{VERSION}}/$VERSION/g" \
              -e "s/{{COMMIT}}/${GITHUB_SHA::7}/g" \
              ../.github/release-notes-template.md > RELEASE_NOTES.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          flags=()
          [[ "$PRERELEASE" == "true" ]] && flags+=(--prerelease)
          [[ "$INPUT_DRAFT" == "true" ]] && flags+=(--draft)
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists. Delete it (or bump the version) and re-run."; exit 1
          fi
          gh release create "$TAG" dist/*.zip dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "$TAG — Revit & AutoCAD 2022–2027" \
            --notes-file dist/RELEASE_NOTES.md \
            "${flags[@]}"

      - name: Keep build output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            artifacts/
            dist/
          if-no-files-found: ignore
          retention-days: 7
